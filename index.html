<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UOC 2026-1</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --text: #111827; --muted: #6b7280;
  --border: #e5e7eb; --accent: #111827; --danger: #dc2626; --danger-bg: #fef2f2; --warn: #b45309; --warn-bg: #fffbeb;
  --info: #1d4ed8; --info-bg: #eff6ff; --ok: #15803d; --ok-bg: #f0fdf4; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  --radius: 14px;
  --fc-border-color: var(--border); --fc-page-bg-color: var(--surface); --fc-neutral-bg-color: var(--surface-2);
  --fc-today-bg-color: rgba(37,99,235,.08); --fc-list-event-hover-bg-color: var(--surface-2);
  --fc-button-bg-color: var(--surface); --fc-button-border-color: var(--border); --fc-button-text-color: var(--text);
  --fc-button-hover-bg-color: var(--surface-2); --fc-button-hover-border-color: var(--border);
  --fc-button-active-bg-color: var(--accent); --fc-button-active-border-color: var(--accent);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b0f17; --surface: #141a24; --surface-2: #1c2330; --text: #e5e7eb; --muted: #9ca3af;
  --border: #273041; --accent: #e5e7eb; --danger: #f87171; --danger-bg: #2a1215; --warn: #fbbf24; --warn-bg: #2a2110;
  --info: #93c5fd; --info-bg: #111c33; --ok: #4ade80; --ok-bg: #0f2418; --shadow: none;
  --fc-today-bg-color: rgba(147,197,253,.10);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--info); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 16px; padding-bottom: 96px; }

/* Barra superior */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top .in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tab { border: 0; background: transparent; padding: 8px 12px; border-radius: 10px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); border: 1px solid var(--border); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.spacer { flex: 1; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Navegación inferior (móvil) */
.bottom { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
.bottom .in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.bottom button { border: 0; background: transparent; padding: 6px 2px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
.bottom button svg { width: 20px; height: 20px; }
.bottom button .dot { width: 14px; height: 14px; margin: 3px 0; }
.bottom button.on { color: var(--text); background: var(--surface-2); font-weight: 600; }
@media (max-width: 760px) {
  .tabs { display: none; }
  .bottom { display: block; }
  .brand small { display: none; }
}

/* Genéricos */
h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: -.02em; }
h2 { font-size: 17px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.grid { display: grid; gap: 14px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 960px) { .g3 { grid-template-columns: 1fr 1fr; } .g4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) { .g3, .g2 { grid-template-columns: 1fr; } }
.section { margin-top: 22px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; user-select: none; }
.chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--surface-2); }
a.btn { text-decoration: none; color: var(--text); }
a.btn.primary { color: var(--bg); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--danger-bg); color: var(--danger); }
.pill.soon { background: var(--warn-bg); color: var(--warn); }
.pill.done { background: var(--ok-bg); color: var(--ok); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; }
.grade { font-weight: 700; font-variant-numeric: tabular-nums; }
.grade .l { font-weight: 600; font-size: .85em; padding: 1px 6px; border-radius: 6px; margin-left: 4px; background: var(--surface-2); }

/* Tarjetas de inicio */
.subj { position: relative; overflow: hidden; cursor: pointer; transition: transform .1s; padding-top: 20px; }
.subj:hover { transform: translateY(-1px); }
.subj::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 5px; background: var(--c); }
.subj .name { font-weight: 650; display: flex; gap: 8px; align-items: center; }
.subj .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next { margin: 14px 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.next .what { font-size: 14px; }
.next .what b { display: block; font-size: 16px; margin-bottom: 2px; }
.days { text-align: right; line-height: 1; }
.days b { font-size: 34px; letter-spacing: -.03em; color: var(--c); }
.days span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
.kv { display: flex; justify-content: space-between; font-size: 14px; margin-top: 8px; gap: 8px; }
.kv .k { color: var(--muted); }
.alerts-mini { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }

/* Listas */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.item:last-child { border-bottom: 0; }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 550; }
.item .t.done { text-decoration: line-through; color: var(--muted); }
.item .m { font-size: 13px; color: var(--muted); }
.item .side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.bar-v { width: 4px; align-self: stretch; border-radius: 4px; background: var(--c); flex: none; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.check input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--c, var(--accent)); cursor: pointer; }
.note-in { width: 70px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: center; }
.date-in { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.comp-h { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 2px; font-size: 13px; }
.comp-h b { font-size: 14px; }
@media (max-width: 640px) {
  .item { flex-wrap: wrap; }
  .item .side { width: 100%; justify-content: flex-start; padding-left: 16px; }
}

/* Avisos */
.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 8px; align-items: flex-start; }
.alert svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.alert.danger { background: var(--danger-bg); color: var(--danger); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }

/* Asignatura */
.hero { border-left: 6px solid var(--c); }
.subtabs { display: flex; gap: 6px; margin: 16px 0; overflow-x: auto; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 20px; margin-top: 2px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.t td.n, table.t th.n { text-align: right; }
.calc { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.result { font-size: 15px; margin-top: 10px; padding: 12px; border-radius: 10px; background: var(--surface-2); }
.result b { font-size: 18px; }

/* PDFs */
.upl { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.upl label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.upl input[type=text], .upl input[type=file] { padding: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); width: 100%; }
@media (max-width: 640px) { .upl { grid-template-columns: 1fr; } }
.pdf { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.pdf:last-child { border-bottom: 0; }
.pdf .ic { width: 34px; height: 40px; border-radius: 6px; background: var(--danger-bg); color: var(--danger); display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }
.pdf a.name { flex: 1; min-width: 0; color: var(--text); text-decoration: none; font-weight: 550; overflow-wrap: anywhere; }
.pdf a.name:hover { text-decoration: underline; }

/* Calendario */
.cal-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
#cal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
.fc .fc-toolbar-title { font-size: 18px; }
.fc .fc-toolbar-title::first-letter { text-transform: uppercase; }
.fc-dayGridWeek-view .fc-daygrid-day-frame, .fc-dayGridDay-view .fc-daygrid-day-frame { min-height: 160px; }
.fc .fc-button { font-size: 13px; padding: 6px 10px; box-shadow: none !important; text-transform: capitalize; }
.fc .fc-button-primary:not(:disabled).fc-button-active { color: var(--bg); }
.fc .fc-daygrid-event { border-radius: 6px; padding: 1px 4px; font-size: 12px; cursor: pointer; white-space: normal; }
.fc .fc-event.is-done { opacity: .5; text-decoration: line-through; }
.fc .fc-event.is-late { outline: 2px solid var(--danger); outline-offset: -2px; }
.fc .fc-event.is-period { opacity: .28; font-size: 11px; }
.fc .fc-list-event { cursor: pointer; }
.fc .mini { font-size: 10px; line-height: 1.15; font-weight: 600; text-align: center; padding: 1px 0; }
.fc .fc-list-event.is-done .fc-list-event-title { text-decoration: line-through; color: var(--muted); }
.fc a { color: inherit; }
.fc .fc-col-header-cell-cushion, .fc .fc-daygrid-day-number { text-decoration: none; }
@media (max-width: 640px) {
  .fc .fc-toolbar { flex-direction: column; gap: 8px; }
  .fc .fc-toolbar-title { font-size: 16px; }
  #cal { padding: 8px; }
  .fc .fc-daygrid-event { font-size: 10px; }
}

/* Modal y toast */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal.open { display: flex; }
.modal .box { background: var(--surface); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 420px; border: 1px solid var(--border); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; background: var(--accent); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 14px; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
.empty { color: var(--muted); padding: 16px 4px; font-size: 14px; }
</style>
</head>

function analyze(a) {

/* ¿Qué nota necesito? — nota uniforme x en todo lo pendiente para llegar a T */
function needed(R, T) {
  const a = R.a, minEC = R.minEC, minPF = a.minPF ?? 0;
  const rem = R.remOpenW, K = R.known;

  if (a.modelo !== 'EC' && R.deliveredW + R.openW < 0.5 - EPS) return { imposible: 'Has entregado menos del 50 % de la EC: No presentado.' };

  if (a.modelo === 'EC') {
    if (rem < EPS) return { hecho: true };
    if (R.bajoMin.length) return { imposible: `${R.bajoMin.map(x => x.c.nombre).join(', ')} está por debajo del mínimo.` };
    const x = Math.max((Math.max(T, minEC) - K) / rem, minComp);

  const ecOpen = rem > EPS;

  if (R.ecMax < minEC - EPS) return { imposible: `Ya no puedes llegar a ${fmt(minEC)} en la EC (máximo ${fmt(R.ecMax)}).` };
  if (ecOpen && pfN != null) {
    if (pfN < minPF - EPS) return { imposible: `La PF está por debajo de ${fmt(minPF)}.` };
    const ecNeed = Math.max(minEC, (T - wPF * pfN) / wEC);
    return { ec: Math.max((ecNeed - K) / rem, minComp) };
  }
  if (!ecOpen) { // EC cerrada, falta la PF
    return { pf: Math.max(minPF, (T - wEC * K) / wPF) };
  }
  // EC abierta y PF pendiente: misma nota en todo
  const x1 = (minEC - K) / rem;
  const x2 = (T - wEC * K) / (wEC * rem + wPF);
  let x = Math.max(x1, x2, minComp);
  if (x >= minPF - EPS) return { ec: x, pf: x };
  // si con menos de 4 bastaría, la PF igualmente necesita el mínimo
  const ecx = Math.max(x1, (T - wPF * minPF - wEC * K) / (wEC * rem), minComp);

  return out;
}
function alertHtml([type, html]) {

}

function dueBadge(e) {

function calEvents() {
  const hoy = S.data.hoy, out = [];
  S.data.entregas.forEach(e => {
    if (!S.calFilter.has(e.asignatura) || !e.fin) return;
    const a = asig(e.asignatura);
    const late = e.fin < hoy && !e.entregada && e.componente !== 'PF';
    out.push({ id: e.id, title: (e.entregada ? '✓ ' : '') + a.abrev + ' · ' + e.actividad, start: e.fin, allDay: true,
      backgroundColor: a.color, borderColor: a.color, textColor: '#fff',
      classNames: [e.entregada ? 'is-done' : '', late ? 'is-late' : ''].filter(Boolean), extendedProps: { eid: e.id, abrev: a.abrev, short: shortName(e.actividad), done: e.entregada } });
    if (S.showPeriods && e.inicio && e.inicio < e.fin) {
      const end = new Date(parseD(e.fin) + 86400000).toISOString().slice(0, 10);
      out.push({ id: e.id + '-p', title: a.abrev + ' · ' + e.actividad + ' (periodo)', start: e.inicio, end, allDay: true,
        backgroundColor: a.color, borderColor: a.color, textColor: '#fff', classNames: ['is-period'], extendedProps: { eid: e.id, abrev: a.abrev, short: '' } });
    }
  });
  return out;
}
function shortName(t) {
  let m;
  if ((m = t.match(/^Cuestionario PEC (\d+)/i))) return 'Q' + m[1];
  if ((m = t.match(/^Cuestionario (\d+)/i))) return 'C' + m[1];
  if ((m = t.match(/^PEC (\d+)/i))) return 'PEC' + m[1];
  if ((m = t.match(/^Práctica (\d+)/i))) return 'P' + m[1];
  if (/^Prueba final/i.test(t)) return 'PF';
  if ((m = t.match(/R(\d+)/))) return 'R' + m[1];
  return t.slice(0, 5);
}
let fcPromise = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function ensureFC() {
  if (typeof FullCalendar !== 'undefined') return Promise.resolve();
  if (!fcPromise) fcPromise = loadScript('https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js')

}
function mountCalendar() {

  const mobile = window.matchMedia('(max-width: 640px)').matches;

    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridDay,dayGridWeek,dayGridMonth,listMonth' },

function asigNotas(R) {
  const a = R.a;
  const T = S.target[a.id] ?? 5;
  const N = needed(R, T);
  const rows = R.comps.map(x => {
    const minOk = x.c.minimo == null || x.nota == null ? '' : (x.nota >= x.c.minimo - EPS ? `<span class="pill done">≥ ${fmt(x.c.minimo)}</span>` : `<span class="pill late">&lt; ${fmt(x.c.minimo)}</span>`);
    return `<tr><td>${esc(x.c.nombre)}${x.grad.length > 1 ? ` <span class="muted">(${x.grad.filter(e => e.nota != null).length}/${x.grad.length})</span>` : ''}</td>
      <td class="n">${pct(x.c.peso)}</td><td class="n">${nota(x.nota)}</td><td class="n">${x.nota != null ? fmt(x.nota * x.c.peso * (x.completa ? 1 : x.grad.filter(e => e.nota != null).length / x.grad.length)) : '—'}</td><td>${minOk}</td></tr>`;

  let res;

  if (N.hecho) res = R.final != null ? `Todo calificado. Nota final: <b>${notaTxt(R.final)}</b> (${esc(R.estado)}).` : 'Todo calificado.';

  else if (N.ec != null && N.pf != null) res = `Necesitas de media ${show(N.ec)} en lo que te queda de EC y ${show(N.pf)} en la prueba final.`;
  else if (N.ec != null) res = `Necesitas de media ${show(N.ec)} en lo que te queda por calificar.`;
  else if (N.pf != null) res = `Necesitas ${show(N.pf)} en la prueba final.`;

  let scen = '';

  }

  return `
  <div class="grid g2">
    <div class="card"><h2>Desglose de la EC</h2>
      <table class="t"><thead><tr><th>Actividad</th><th class="n">Peso</th><th class="n">Nota</th><th class="n">Aporta</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="kv" style="margin-top:12px"><span class="k">Puntos asegurados (sobre 10)</span><span class="grade">${R.gradedW > EPS ? fmt(R.known) : '—'}</span></div>
      <div class="kv"><span class="k">EC máxima alcanzable</span>${nota(R.ecMax)}</div>
      ${a.modelo !== 'EC' ? `<div class="kv"><span class="k">Prueba final</span>${nota(R.pf ? R.pf.nota : null)}</div>` : ''}
      <p class="muted" style="font-size:12px;margin:12px 0 0">Letras según la tabla estándar UOC: A 9–10 · B 7–8,9 · C+ 5–6,9 · C- 3–4,9 · D 0–2,9.</p>
    </div>
    <div class="card"><h2>¿Qué nota necesito?</h2>
      <div class="calc">Quiero sacar
        ${[5, 7, 9].map(v => `<span class="chip ${T === v ? 'on' : ''}" data-target="${a.id}:${v}">${v === 5 ? 'Aprobar (5)' : v === 7 ? 'Notable (7)' : 'Sobresaliente (9)'}</span>`).join('')}
        <input class="note-in" inputmode="decimal" id="targetIn" value="${[5, 7, 9].includes(T) ? '' : fmt(T)}" placeholder="otra">
      </div>
      <div class="result">${res}</div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Calcula la misma nota en todo lo pendiente, respetando los mínimos del plan docente${a.modelo !== 'EC' ? ` (EC ≥ ${fmt(a.minEC)}, PF ≥ ${fmt(a.minPF)})` : ` (≥ ${fmt(a.minEC)} en cada actividad)`}. Lo que ya ha vencido sin entregar cuenta como 0.</p>
    </div>
  </div>${scen}`;
}

function asigPdf(a) {
  const P = S.pdfs[a.id];
  const temas = new Set(MODULOS[a.abrev] || []);
  if (P) P.archivos.forEach(f => temas.add(f.tema));
  let list = '<div class="empty">Cargando archivos…</div>';
  if (P) {
    if (!P.archivos.length) list = '<div class="empty">Aún no hay PDFs en esta asignatura.</div>';
    else {
      const groups = {};
      P.archivos.forEach(f => (groups[f.tema] = groups[f.tema] || []).push(f));
      list = Object.keys(groups).sort((x, y) => x.localeCompare(y, 'es')).map(t => `
        <div class="comp-h"><b>${esc(t)}</b><span class="muted">${groups[t].length} archivo${groups[t].length > 1 ? 's' : ''}</span></div>
        ${groups[t].map(f => `<div class="pdf"><span class="ic">PDF</span>
          <a class="name" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nombre)}<div class="muted" style="font-size:12px;font-weight:400">${(f.tamano / 1048576).toFixed(1).replace('.', ',')} MB · ${fdate(f.fecha, false)}</div></a>
          <button class="icon-btn" data-delpdf="${a.id}:${f.id}" title="Mover a la papelera" aria-label="Eliminar">${ICON.trash}</button></div>`).join('')}`).join('');
    }
  }
  return `<div class="card">
    <h2>Subir PDFs</h2>
    <div class="upl">
      <label>Contenido / tema<input type="text" id="pdfTema" list="temas" placeholder="p. ej. Módulo 1 · Los números"><datalist id="temas">${[...temas].map(t => `<option value="${esc(t)}">`).join('')}</datalist></label>
      <label>Archivos PDF<input type="file" id="pdfFile" accept="application/pdf" multiple></label>
      <button class="btn primary" id="btnUpload" data-asig="${a.id}">${ICON.up} Subir</button>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">Se guardan en tu Drive, en la carpeta de la asignatura, con una subcarpeta por tema.${P ? ` <a href="${esc(P.carpetaUrl)}" target="_blank">Abrir carpeta</a>` : ''}</p>
  </div>
  <div class="card section">${list}</div>`;
}

function afterAsig(id) {
  if ((S.subtab[id] || 'entregas') === 'pdf' && !S.pdfs[id]) {
    call('listPdfs', id).then(r => { S.pdfs[id] = r; if (S.view === 'asig:' + id) render(); }).catch(fail);
  }
}

/* =================================================================
   Acciones
   ================================================================= */
function patchLocal(id, patch) { const e = S.data.entregas.find(x => x.id === id); if (e) Object.assign(e, patch); }
function save(id, patch, msg) {
  const e0 = S.data.entregas.find(x => x.id === id);
  const antes = {}; Object.keys(patch).forEach(k => antes[k] = e0 ? e0[k] : undefined);
  patchLocal(id, patch); render(); refreshCalendar();
  call('updateEntrega', id, patch).then(d => { S.data = d; cacheData(d); render(); if (msg) toast(msg); })
    .catch(e => { patchLocal(id, antes); render(); refreshCalendar(); toast('No se ha guardado (' + (e.message || e) + '). Inténtalo de nuevo con conexión.', 5000); });
}
function parseNota(v) {
  v = String(v).trim().replace(',', '.');
  if (v === '') return null;
  const n = Number(v);
  if (isNaN(n) || n < 0 || n > 10) throw new Error('La nota tiene que ser un número entre 0 y 10');
  return r2(n);
}

document.addEventListener('click', ev => {
  const t = ev.target;
  const goEl = t.closest('[data-go]');
  if (t.closest('[data-close]')) closeModal();
  if (t.id === 'modal') closeModal();
  if (goEl && !t.closest('input,label,a')) { go(goEl.dataset.go); return; }
  const f = t.closest('[data-filter]');
  if (f) {
    const k = f.dataset.filter, all = S.data.asignaturas.map(a => a.id);
    if (k === '*') S.calFilter = new Set(all);
    else if (S.calFilter.size === all.length) S.calFilter = new Set([k]);   // de "todas" a solo una
    else { S.calFilter.has(k) ? S.calFilter.delete(k) : S.calFilter.add(k); if (!S.calFilter.size) S.calFilter = new Set(all); }
    store('uoc.calFilter', [...S.calFilter].join(','));
    document.querySelectorAll('[data-filter]').forEach(c => c.classList.toggle('on', c.dataset.filter === '*' ? S.calFilter.size === all.length : S.calFilter.has(c.dataset.filter)));
    refreshCalendar(); return;
  }
  const st = t.closest('[data-subtab]');
  if (st) { const [id, k] = st.dataset.subtab.split(':'); S.subtab[id] = k; render(); return; }
  const tg = t.closest('[data-target]');
  if (tg) { const [id, v] = tg.dataset.target.split(':'); S.target[id] = Number(v); render(); return; }
  if (t.closest('#btnGcal')) {
    const b = t.closest('#btnGcal'); b.disabled = true; b.lastChild.textContent = ' Sincronizando…';
    call('syncCalendar').then(r => { toast(`Google Calendar: ${r.creados} nuevos, ${r.actualizados} actualizados (calendario "${r.calendario}")`, 4500); load(); })
      .catch(fail).finally(() => { b.disabled = false; b.lastChild.textContent = ' Añadir a Google Calendar'; });
    return;
  }
  const del = t.closest('[data-delpdf]');
  if (del) {
    const [aid, fid] = del.dataset.delpdf.split(':');
    if (!confirm('¿Mover este PDF a la papelera de Drive?')) return;
    call('deletePdf', aid, fid).then(r => { S.pdfs[aid] = r; render(); toast('PDF eliminado'); }).catch(fail);
    return;
  }
  if (t.closest('#btnUpload')) { uploadPdfs(t.closest('#btnUpload').dataset.asig); return; }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.done) { save(t.dataset.done, { entregada: t.checked }, t.checked ? 'Marcada como entregada ✓' : 'Marcada como pendiente'); return; }
  if (t.dataset.nota) {
    try { const n = parseNota(t.value); save(t.dataset.nota, { nota: n }, n == null ? 'Nota borrada' : `Nota guardada: ${notaTxt(n)}`); }
    catch (e) { toast(e.message, 3500); render(); }
    return;
  }
  if (t.dataset.fecha) { save(t.dataset.fecha, { fin: t.value || '' }, t.value ? 'Fecha de la PF guardada' : 'Fecha borrada'); return; }
  if (t.id === 'chkPeriods') { S.showPeriods = t.checked; store('uoc.periods', t.checked ? '1' : '0'); refreshCalendar(); return; }
  if (t.id === 'targetIn') { try { const n = parseNota(t.value); if (n != null) { S.target[S.view.slice(5)] = n; render(); } } catch (e) { toast(e.message); } return; }
  if (t.id === 'scenIn') { try { const n = parseNota(t.value); if (n != null) { S.scen[S.view.slice(5)] = n; render(); } } catch (e) { toast(e.message); } return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
  if (ev.key === 'Enter' && ev.target.matches('.note-in')) ev.target.blur();
});

async function uploadPdfs(aid) {
  const files = [...($('#pdfFile').files || [])];
  const tema = $('#pdfTema').value.trim();
  if (!files.length) return toast('Elige al menos un PDF');
  const btn = $('#btnUpload'); btn.disabled = true;
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (f.size > 45 * 1048576) { toast(`${f.name} pesa más de 45 MB: súbelo directamente a la carpeta de Drive`, 5000); continue; }
      btn.lastChild.textContent = ` Subiendo ${i + 1}/${files.length}…`;
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
      S.pdfs[aid] = await call('uploadPdf', aid, tema, f.name, b64);
    }
    toast('PDFs subidos');
  } catch (e) { fail(e); }
  btn.disabled = false; render();
}

/* =================================================================
   Tema y arranque
   ================================================================= */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#btnTheme').innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
}
$('#btnTheme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; store('uoc.theme', t); applyTheme(t); };
$('#btnRefresh').onclick = () => { if (!IN_GAS && !API && !DEMO) return location.reload(); S.pdfs = {}; load(true); };
applyTheme(store('uoc.theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

function todayLocal() { const n = new Date(); return new Date(n.getTime() - n.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function cacheData(d) { if (!DEMO) store('uoc.cache', JSON.stringify(d)); }
function load(notify) {
  // Arranque rápido: mostrar al instante los últimos datos guardados y actualizar en segundo plano
  if (!S.data && !DEMO) {
    try {
      const c = JSON.parse(store('uoc.cache') || 'null');
      if (c && c.asignaturas) { c.hoy = todayLocal(); setData(c); spin(true); }
    } catch (e) {}
  }
  return call('getData').then(d => {
    spin(false); cacheData(d);
    if (S.data && JSON.stringify(Object.assign({}, S.data, { hoy: d.hoy })) === JSON.stringify(d)) { S.data = d; return notify && toast('Datos actualizados'); }
    setData(d);
    if (notify) toast('Datos actualizados');
  }).catch(e => {
    spin(false);
    if (S.data && !/clave/i.test(e.message || '')) return toast('Sin conexión: mostrando los últimos datos guardados', 4000);
    if (!IN_GAS && API) return showSetup('No se pudo conectar: ' + (e.message || e));
    $('#app').innerHTML = `<div class="card">${alertHtml(['danger', 'No se pudieron cargar los datos: ' + esc(e.message || e) + '<br>¿Has ejecutado <b>setup</b> desde el menú UOC de la hoja?'])}</div>`;
  });
}
function spin(on) { $('#btnRefresh').classList.toggle('spinning', on); }
function setData(d) {
    S.data = d;
    if (!S.calFilter) {
      const saved = (store('uoc.calFilter') || '').split(',').filter(x => d.asignaturas.some(a => a.id === x));
      S.calFilter = new Set(saved.length ? saved : d.asignaturas.map(a => a.id));
    }
    render();
}

/* ---------- Conexión de la app instalable ---------- */
function showSetup(err) {
  $('.bottom').style.display = 'none';
  $('#tabs').innerHTML = '';
  $('#app').innerHTML = `<div class="card" style="max-width:560px;margin:24px auto">
    <h1>Conectar con tu hoja</h1>
    <p class="sub">Pega la URL de la implementación de Apps Script y tu clave secreta. Solo hay que hacerlo una vez en cada dispositivo.</p>
    ${err ? alertHtml(['danger', esc(err)]) : ''}
    <div class="upl" style="grid-template-columns:1fr">
      <label>URL de Apps Script (termina en /exec)<input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API ? API.url : '')}" autocomplete="off"></label>
      <label>Clave secreta<input type="text" id="cfgKey" placeholder="la que te dio crearClave()" value="${esc(API ? API.key : '')}" autocomplete="off"></label>
      <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn primary" id="btnConnect">Conectar</button><button class="btn" id="btnDemo">Ver demo con datos de ejemplo</button></div>
    </div></div>`;
  $('#btnConnect').onclick = () => {
    const url = $('#cfgUrl').value.trim(), key = $('#cfgKey').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('La URL tiene que empezar por https://script.google.com/ y terminar en /exec', 5000);
    if (key.length < 20) return toast('La clave parece incompleta', 4000);
    API = { url, key }; $('#btnConnect').disabled = true; $('#btnConnect').textContent = 'Conectando…';
    call('getData').then(() => { store('uoc.api', JSON.stringify(API)); $('.bottom').style.display = ''; $('#btnCfg').style.display = ''; load(); toast('Conectado ✓'); })
      .catch(e => showSetup('No se pudo conectar: ' + (e.message || e)));
  };
  $('#btnDemo').onclick = () => { DEMO = true; $('#demoBanner').style.display = 'block'; $('.bottom').style.display = ''; load(); };
}

function openCfg() {
  const link = location.origin + location.pathname + '#cfg=' + encodeURIComponent(btoa(JSON.stringify(API)));
  $('#modalBox').innerHTML = `
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Conexión</h2><button class="icon-btn" data-close aria-label="Cerrar">✕</button></div>
    <p class="muted" style="font-size:14px">Conectada a tu hoja de Drive mediante Apps Script.</p>
    <h3 style="margin-top:14px">Configurar otro dispositivo</h3>
    <p style="font-size:14px;margin:0 0 8px">Envíate este enlace (solo a ti: incluye tu clave) y ábrelo en el móvil o la tablet. Se conectará solo.</p>
    <input type="text" id="cfgLink" readonly value="${esc(link)}" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:12px">
    <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
      <button class="btn primary" id="btnCopyLink">Copiar enlace</button>
      <span class="spacer"></span>
      <button class="btn" id="btnDisconnect">Desconectar este dispositivo</button>
    </div>`;
  $('#modal').classList.add('open');
  $('#btnCopyLink').onclick = () => {
    const i = $('#cfgLink'); i.select();
    (navigator.clipboard ? navigator.clipboard.writeText(i.value) : Promise.reject()).then(() => toast('Enlace copiado'))
      .catch(() => { try { document.execCommand('copy'); toast('Enlace copiado'); } catch (e) { toast('Selecciónalo y cópialo a mano'); } });
  };
  $('#btnDisconnect').onclick = () => { if (!confirm('¿Desconectar este dispositivo?')) return; store('uoc.api', ''); store('uoc.cache', ''); API = null; closeModal(); $('#btnCfg').style.display = 'none'; S.data = null; showSetup(); };
}
$('#btnCfg').onclick = openCfg;

S.view = store('uoc.view') || 'inicio';
S.showPeriods = store('uoc.periods') === '1';
loadCfg();
if (IN_GAS) load();
else if (API) { $('#btnCfg').style.display = ''; load(); }
else showSetup();

if (!IN_GAS && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
